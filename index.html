<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 生存游戏</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<div id="app">
  <!-- 顶部：标题 + 操作按钮 -->
  <header>
    <h1>AI 生存游戏</h1>
    <div class="toolbar">
      <button id="btnNew">新建游戏</button>
      <button id="btnSave">保存存档</button>
      <button id="btnImport">导入存档</button>
      <input type="file" id="importFile" accept=".json">
      <button id="btnReloadRules">重新载入规则</button>
      <button id="btnSettings" onclick="(function(){
        try{
          var modal=document.getElementById('settingsModal');
          if(!modal){alert('设置弹窗加载失败');return;}
          var sel=document.getElementById('providerSelect');
          var themeSel=document.getElementById('themeSelect');
          var customFields=document.getElementById('customFields');
          var keyLabel=document.getElementById('keyLabel');
          var keyInput=document.getElementById('apiKeyInput');
          var hintEl=document.getElementById('apiKeyHint');
          var urlInput=document.getElementById('customUrlInput');
          var modelInput=document.getElementById('customModelInput');
          var id='deepseek';
          try{id=localStorage.getItem('survival_provider')||'deepseek';}catch(e){}
          if(sel)sel.value=id;
          if(themeSel){var t='dark';try{t=localStorage.getItem('survival_theme')||'dark';}catch(e){}themeSel.value=t;}
          if(customFields)customFields.style.display=(id==='custom')?'flex':'none';
          if(id==='custom'){
            if(urlInput){try{urlInput.value=localStorage.getItem('survival_custom_url')||'';}catch(e){}}
            if(modelInput){try{modelInput.value=localStorage.getItem('survival_custom_model')||'';}catch(e){}}
          }
          var labels={deepseek:'DeepSeek',glm:'智谱 GLM（免费）',qwen:'通义千问（便宜）',custom:'自定义'};
          if(keyLabel)keyLabel.textContent=(id==='custom'?'自定义':(labels[id]||''))+' API Key';
          if(keyInput){keyInput.value='';var sk='';try{sk=localStorage.getItem('survival_key_'+id)||'';}catch(e){}if(sk)keyInput.value='（已保存，留空则不修改）';}
          if(hintEl){
            if(id==='custom'){hintEl.textContent='自定义：填写任意 OpenAI 兼容接口地址、模型名和 API Key。';}
            else{var hasKey=false;try{hasKey=!!localStorage.getItem('survival_key_'+id);}catch(e){}hintEl.textContent=hasKey?'该服务商 Key 已保存在浏览器（留空则不修改）。':'请输入你的 '+(labels[id]||id)+' API Key（只存本浏览器）。';}
          }
          modal.style.display='flex';
        }catch(err){
          alert('打开设置失败: '+err.message);
        }
      })()">设置</button>
    </div>
  </header>

  <!-- 主内容列 + 右侧侧边栏 -->
  <div id="bodyRow">
    <div id="mainCol">
      <!-- 日期/灾日 + 六属性状态栏（合并一行） -->
      <div id="statusRow">
        <div id="dayBanner">0天 灾日(正常)</div>
        <div id="statsBar"></div>
      </div>

      <!-- 游戏档案（可折叠：自动分类的长期记忆） -->
      <details id="memoryPanel">
        <summary>📋 游戏档案 <span id="memoryCount"></span></summary>
        <div id="memoryContent"></div>
      </details>

      <!-- 环境/动作结果区（滚动对话流） -->
      <main id="log"></main>

      <!-- 固定指令区 -->
      <footer>
        <div id="cmdButtons">
          <button class="cmd" data-cmd="[探索]">[探索]</button>
          <button class="cmd" data-cmd="[思索]">[思索]</button>
          <button class="cmd" data-cmd="[专注]">[专注]</button>
          <button class="cmd" data-cmd="[休息]">[休息]</button>
          <button class="cmd" data-cmd="[睡觉]">[睡觉]</button>
          <button class="cmd" data-cmd="[其他]">[其他]</button>
        </div>
        <div id="inputRow">
          <input type="text" id="cmdInput" placeholder="指令 > 输入自定义行动..." autocomplete="off">
          <button id="btnSend">发送</button>
        </div>
      </footer>
    </div>

    <!-- 右侧侧边栏：背包 / 家中物品 / 已保存地点 -->
    <aside id="sidebar">
      <div id="sidebarHeader">
        <span>📦 物资</span>
        <button id="btnSidebarToggle" title="展开/收起">◀</button>
      </div>
      <div id="sidebarBody"></div>
    </aside>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" style="display:none">
  <div class="modal-box">
    <h2>设置</h2>
    <div id="apiKeyHint" class="hint"></div>

    <label>界面主题</label>
    <select id="themeSelect">
      <option value="dark">暗黑</option>
      <option value="neon">蓝紫渐变</option>
    </select>

    <label>AI 服务商</label>
    <select id="providerSelect">
      <option value="deepseek">DeepSeek</option>
      <option value="glm">智谱 GLM（免费）</option>
      <option value="qwen">通义千问（便宜）</option>
      <option value="custom">自定义（OpenAI 兼容）</option>
    </select>

    <div id="customFields" style="display:none">
      <label>接口地址（https://.../chat/completions）</label>
      <input type="text" id="customUrlInput" placeholder="https://.../v1/chat/completions">
      <label>模型名</label>
      <input type="text" id="customModelInput" placeholder="如 local-model / gpt-4o-mini">
    </div>

    <label id="keyLabel">API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-...">

    <!-- 自定义壁纸 -->
    <fieldset id="wallpaperSection">
      <legend>🖼️ 自定义壁纸</legend>
      <input type="file" id="wallpaperFile" accept="image/*">
      <button id="btnWallpaperUpload">上传壁纸图片</button>
      <button id="btnWallpaperClear">清除壁纸</button>
      <label class="range-row">模糊度 <span id="wallBlurVal">0</span>
        <input type="range" id="wallBlur" min="0" max="24" step="1" value="0">
      </label>
      <label class="range-row">背景明暗 <span id="wallDimVal">0</span>
        <input type="range" id="wallDim" min="0" max="80" step="1" value="0">
      </label>
      <div class="hint">壁纸与调节只保存在你的浏览器中；模糊+明暗让文字更清晰。</div>
    </fieldset>

    <!-- 自定义 Mod -->
    <fieldset id="pluginSection">
      <legend>🧩 自定义 Mod</legend>
      <input type="file" id="pluginFile" accept=".txt,.text">
      <button id="btnPluginImport">导入 Mod (.txt)</button>
      <button id="btnPluginExample">查看 Mod 格式</button>
      <textarea id="pluginPaste" rows="4" placeholder="或直接把 Mod 文本粘贴到这里（手机上传文件失败时用这个最方便）"></textarea>
      <button id="btnPluginPaste">从文本框导入</button>
      <div id="pluginList" class="plugin-list"></div>
      <div class="hint">Mod 用记事本即可编写：可自定义状态栏、新增指令按钮、回答风格、追加规则（完整状态结算）。</div>
    </fieldset>

    <div class="modal-btns">
      <button id="btnApiSave">保存</button>
      <button id="btnApiCancel">关闭</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 壁纸背景层（全屏，位于内容之下） -->
<div id="wallpaper"></div>

<script src="game.js"></script>
</body>
</html>
